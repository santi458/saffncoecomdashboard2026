const fmt = (v) => {
  if (v == null) return "—";
  if (v >= 1e12) return `${(v / 1e12).toFixed(2)}T`;
  if (v >= 1e9) return `${(v / 1e9).toFixed(2)}B`;
  if (v >= 1e6) return `${(v / 1e6).toFixed(1)}M`;
  return v.toLocaleString("id-ID");
};

const fmtFull = (v) => {
  if (v == null) return "—";
  return `Rp ${(v / 1e9).toFixed(2)}B`;
};

const pct = (v) => {
  if (v == null) return "—";
  return `${v >= 0 ? "+" : ""}${(v * 100).toFixed(1)}%`;
};

// ─── KPI Card ───────────────────────────────────────────────────────────────

function KpiCard({ label, value, subtitle, delta, deltaLabel, accent = COLORS.primary }) {
  const isPositive = delta != null && delta >= 0;
  return (
    <div style={{
      background: COLORS.card, borderRadius: 16, padding: "24px 28px",
      boxShadow: "0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06)",
      border: "1px solid #e2e8f0", flex: 1, minWidth: 200,
    }}>
      <div style={{ fontSize: 13, fontWeight: 500, color: COLORS.textSecondary, letterSpacing: 0.3, marginBottom: 8 }}>
        {label}
      </div>
      <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.text, letterSpacing: -0.5 }}>
        {value}
      </div>
      {subtitle && (
        <div style={{ fontSize: 13, color: COLORS.textSecondary, marginTop: 4 }}>{subtitle}</div>
      )}
      {delta != null && (
        <div style={{
          marginTop: 10, display: "inline-flex", alignItems: "center", gap: 4,
          fontSize: 13, fontWeight: 600, padding: "3px 10px", borderRadius: 20,
          background: isPositive ? "#ecfdf5" : "#fef2f2",
          color: isPositive ? "#059669" : "#dc2626",
        }}>
          {isPositive ? "↑" : "↓"} {pct(Math.abs(delta))}
          {deltaLabel && <span style={{ fontWeight: 400, marginLeft: 4 }}>{deltaLabel}</span>}
        </div>
      )}
    </div>
  );
}

// ─── Custom Tooltip ─────────────────────────────────────────────────────────

function CustomTooltip({ active, payload, label }) {
  if (!active || !payload?.length) return null;
  return (
    <div style={{
      background: "#fff", border: "1px solid #e2e8f0", borderRadius: 12,
      padding: "12px 16px", boxShadow: "0 4px 12px rgba(0,0,0,0.08)",
    }}>
      <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 6, color: COLORS.text }}>{label}</div>
      {payload.map((p, i) => (
        <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginBottom: 2 }}>
          <div style={{ width: 8, height: 8, borderRadius: 4, background: p.color }} />
          <span style={{ color: COLORS.textSecondary }}>{p.name}:</span>
          <span style={{ fontWeight: 600 }}>{fmtFull(p.value)}</span>
        </div>
      ))}
    </div>
  );
}

// ─── Login Screen Component ─────────────────────────────────────────────────

function LoginScreen({ onLogin }) {
  const [pw, setPw] = useState("");
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  const handleSubmit = (e) => {
    e.preventDefault();
    if (pw === DASHBOARD_PASSWORD) {
      onLogin();
    } else {
      setError(true);
      setShake(true);
      setTimeout(() => setShake(false), 500);
    }
  };

  return (
    <div style={{
      minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      background: "linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%)",
      fontFamily: "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
    }}>
      <form onSubmit={handleSubmit} style={{
        background: "#fff", borderRadius: 20, padding: "48px 40px", width: 380,
        boxShadow: "0 8px 30px rgba(0,0,0,0.08)", border: "1px solid #e2e8f0",
        textAlign: "center", transform: shake ? "translateX(-8px)" : "none",
        transition: "transform 0.1s",
        animation: shake ? "shake 0.5s ease-in-out" : "none",
      }}>
        <div style={{ fontSize: 32, fontWeight: 800, color: "#0f172a", letterSpacing: -1, marginBottom: 4 }}>
          SAFF & Co.
        </div>
        <div style={{ fontSize: 14, color: "#64748b", marginBottom: 32 }}>
          E-Commerce Dashboard
        </div>
        <div style={{ fontSize: 13, color: "#64748b", textAlign: "left", marginBottom: 8, fontWeight: 500 }}>
          Password
        </div>
        <input
          type="password"
          value={pw}
          onChange={(e) => { setPw(e.target.value); setError(false); }}
          placeholder="Enter dashboard password"
          style={{
            width: "100%", padding: "12px 16px", borderRadius: 12, fontSize: 14,
            border: `1.5px solid ${error ? "#ef4444" : "#e2e8f0"}`,

            background: error ? "#fef2f2" : "#fff",

        />
        {error && (
          <div style={{ fontSize: 12, color: "#ef4444", marginTop: 8, textAlign: "left" }}>
            Password salah. Coba lagi.

        )}
        <button type="submit" style={{

          Internal use only · SAFF & Co. {new Date().getFullYear()}

    </div>
  );
}

function Dashboard() {
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [selectedYear, setSelectedYear] = useState(2026);
  const [comparisonYear, setComparisonYear] = useState(2025);
  const [activeTab, setActiveTab] = useState("overview");

  // Build monthly trend data for area chart
  const trendData = useMemo(() => {
    return MONTHS.map((m) => ({
      month: m,
      [selectedYear]: SALES_DATA[selectedYear]?.[m] || null,
      [comparisonYear]: SALES_DATA[comparisonYear]?.[m] || null,
      target: selectedYear === 2026 ? TARGET_2026[m] : null,
    }));
  }, [selectedYear, comparisonYear]);

  // KPI calculations
  const kpis = useMemo(() => {
    const sales26 = SALES_DATA[2026];
    const sales25 = SALES_DATA[2025];
    const expense26 = EXPENSE_DATA[2026];

    const currentMonthGMV = sales26.Feb;
    const prevMonthGMV = sales26.Jan;
    const lastYearSameMonth = sales25.Feb;
    const momGrowth = (currentMonthGMV - prevMonthGMV) / prevMonthGMV;
    const yoyGrowth = (currentMonthGMV - lastYearSameMonth) / lastYearSameMonth;

    const ytdGMV = sales26.Jan + sales26.Feb;
    const ytdTarget = TARGET_2026.Jan + TARGET_2026.Feb;
    const achRate = ytdGMV / ytdTarget;

    const ytdExpense = expense26.Jan + expense26.Feb;
    const roi = ytdGMV / ytdExpense;

    const costRatio = ytdExpense / ytdGMV;

    // Full year 2025
    const total2025 = Object.values(sales25).reduce((a, b) => a + (b || 0), 0);
    const total2024 = Object.values(SALES_DATA[2024]).reduce((a, b) => a + (b || 0), 0);
    const annualGrowth = (total2025 - total2024) / total2024;

    return { currentMonthGMV, momGrowth, yoyGrowth, ytdGMV, ytdTarget, achRate, ytdExpense, roi, costRatio, total2025, annualGrowth };
  }, []);

  // Expense vs Sales bar data
  const efficiencyData = useMemo(() => {
    return MONTHS.slice(0, 12).map((m) => ({
      month: m,
      GMV: SALES_DATA[2025][m],
      Expense: EXPENSE_DATA[2025][m],
      costRatio: EXPENSE_DATA[2025][m] && SALES_DATA[2025][m]
        ? (EXPENSE_DATA[2025][m] / SALES_DATA[2025][m]) * 100 : null,
    }));
  }, []);

  // Channel pie data
  const channelData = useMemo(() => {
    return Object.entries(CHANNEL_SHARE_2025).map(([name, value]) => ({
      name, value: +(value * 100).toFixed(1),
    }));
  }, []);

  // YOY comparison bar chart
  const yoyData = useMemo(() => {
    return MONTHS.map((m) => ({
      month: m,
      "2024": (SALES_DATA[2024][m] || 0) / 1e9,
      "2025": (SALES_DATA[2025][m] || 0) / 1e9,
      "2026": (SALES_DATA[2026][m] || 0) / 1e9,
    }));
  }, []);

  // Target vs Actual 2026
  const targetData = useMemo(() => {
    return MONTHS.map((m) => ({
      month: m,
      Target: TARGET_2026[m] ? TARGET_2026[m] / 1e9 : null,
      Actual: SALES_DATA[2026][m] ? SALES_DATA[2026][m] / 1e9 : null,
      achievement: SALES_DATA[2026][m] && TARGET_2026[m]
        ? ((SALES_DATA[2026][m] / TARGET_2026[m]) * 100).toFixed(1) : null,
    }));
  }, []);

                    <td style={{ padding: "10px 12px", fontWeight: 600 }}>{c.name}</td>
                    <td style={{ padding: "10px 12px" }}>{c.month}</td>
                    <td style={{ padding: "10px 12px" }}>
                      <span style={{
                        padding: "2px 10px", borderRadius: 12, fontSize: 11, fontWeight: 600,
                        background: c.platform === "Shopee" ? "#fff1f2" : c.platform === "TikTok" ? "#f0fdf4" : "#eff6ff",
                        color: c.platform === "Shopee" ? "#e11d48" : c.platform === "TikTok" ? "#16a34a" : COLORS.primary,
                      }}>{c.platform}</span>
                    </td>
                    <td style={{ padding: "10px 12px", textAlign: "right" }}>{fmt(c.budget)}</td>
                    <td style={{ padding: "10px 12px", textAlign: "right", fontWeight: 600 }}>{c.gmv ? fmt(c.gmv) : "—"}</td>
                    <td style={{
                      padding: "10px 12px", textAlign: "right", fontWeight: 700,
                      color: c.roi ? (c.roi >= 15 ? "#059669" : c.roi >= 10 ? COLORS.primary : "#f59e0b") : COLORS.textSecondary,
                    }}>{c.roi ? `${c.roi}x` : "—"}</td>
                    <td style={{ padding: "10px 12px" }}>
                      <span style={{
                        padding: "3px 12px", borderRadius: 20, fontSize: 11, fontWeight: 600,
                        background: c.status === "completed" ? "#ecfdf5" : "#fefce8",
                        color: c.status === "completed" ? "#059669" : "#d97706",
                      }}>
                        {c.status === "completed" ? "Completed" : "Upcoming"}
                      </span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {/* Campaign ROI mini chart */}
          <div style={{ marginTop: 24 }}>
            <p style={{ fontSize: 12, color: COLORS.textSecondary, marginBottom: 12 }}>Campaign ROI comparison (completed only)</p>
            <ResponsiveContainer width="100%" height={160}>
              <BarChart data={CAMPAIGNS.filter(c => c.status === "completed")} layout="vertical" margin={{ left: 10 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" horizontal={true} vertical={false} />
                <XAxis type="number" tick={{ fontSize: 11, fill: COLORS.textSecondary }} axisLine={false} tickLine={false}
                  tickFormatter={(v) => `${v}x`} />
                <YAxis type="category" dataKey="name" tick={{ fontSize: 11, fill: COLORS.text }} axisLine={false} tickLine={false} width={150} />
                <Tooltip formatter={(v) => [`${v}x`, "ROI"]} />
                <Bar dataKey="roi" radius={[0, 6, 6, 0]} name="ROI">
                  {CAMPAIGNS.filter(c => c.status === "completed").map((c, i) => (
                    <Cell key={i} fill={c.roi >= 15 ? COLORS.success : c.roi >= 12 ? COLORS.primary : COLORS.warning} />
                  ))}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
          </div>
        </div>

        </>}

        {/* ════════ PLATFORM BREAKDOWN TAB ════════ */}
        {activeTab === "platforms" && <>
          {/* Stacked Area: Platform GMV over time */}
          <div style={{
            background: COLORS.card, borderRadius: 16, padding: 28,
            border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)", marginBottom: 20,
          }}>
            <h3 style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 600, color: COLORS.text }}>
              GMV by Platform — 2025 Monthly
            </h3>
            <p style={{ margin: "0 0 20px", fontSize: 12, color: COLORS.textSecondary }}>
              Shopee, TikTok, Tokopedia & Others · Stacked area
            </p>
            <ResponsiveContainer width="100%" height={320}>
              <AreaChart data={PLATFORM_DATA_2025}>
                <defs>
                  <linearGradient id="gShopee" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="5%" stopColor="#2563eb" stopOpacity={0.3} />
                    <stop offset="95%" stopColor="#2563eb" stopOpacity={0.05} />
                  </linearGradient>
                  <linearGradient id="gTiktok" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="5%" stopColor="#10b981" stopOpacity={0.3} />
                    <stop offset="95%" stopColor="#10b981" stopOpacity={0.05} />
                  </linearGradient>
                  <linearGradient id="gTokped" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="5%" stopColor="#f59e0b" stopOpacity={0.3} />
                    <stop offset="95%" stopColor="#f59e0b" stopOpacity={0.05} />
                  </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" />
                <XAxis dataKey="month" tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false}
                  tickFormatter={(v) => `${(v / 1e9).toFixed(0)}B`} />
                <Tooltip content={<CustomTooltip />} />
                <Area type="monotone" dataKey="Shopee" stackId="1" stroke="#2563eb" fill="url(#gShopee)" strokeWidth={2} />
                <Area type="monotone" dataKey="TikTok" stackId="1" stroke="#10b981" fill="url(#gTiktok)" strokeWidth={2} />
                <Area type="monotone" dataKey="Tokopedia" stackId="1" stroke="#f59e0b" fill="url(#gTokped)" strokeWidth={2} />
                <Area type="monotone" dataKey="Others" stackId="1" stroke="#94a3b8" fill="#f1f5f9" strokeWidth={1} />
                <Legend wrapperStyle={{ fontSize: 12 }} />
              </AreaChart>
            </ResponsiveContainer>
          </div>

          {/* Platform KPI cards */}
          <div style={{ display: "flex", gap: 16, marginBottom: 20, flexWrap: "wrap" }}>
            {(() => {
              const totals2025 = PLATFORM_DATA_2025.reduce((acc, m) => {
                acc.Shopee += m.Shopee; acc.TikTok += m.TikTok; acc.Tokopedia += m.Tokopedia; acc.Others += m.Others;
                return acc;
              }, { Shopee: 0, TikTok: 0, Tokopedia: 0, Others: 0 });
              const grandTotal = Object.values(totals2025).reduce((a, b) => a + b, 0);
              return Object.entries(totals2025).map(([name, val]) => (
                <KpiCard key={name} label={`${name.toUpperCase()} (2025)`}
                  value={fmt(val)}
                  subtitle={`${((val / grandTotal) * 100).toFixed(1)}% of total GMV`}
                />
              ));
            })()}
          </div>

          {/* Platform Radar Chart */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
            <div style={{
              background: COLORS.card, borderRadius: 16, padding: 28,
              border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)",
            }}>
              <h3 style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 600, color: COLORS.text }}>
                Platform Scorecard
              </h3>
              <p style={{ margin: "0 0 16px", fontSize: 12, color: COLORS.textSecondary }}>
                Relative performance across key metrics (indexed 0–100)
              </p>
              <ResponsiveContainer width="100%" height={300}>
                <RadarChart data={[
                  { metric: "GMV Share", Shopee: 69, TikTok: 22, Tokopedia: 6 },
                  { metric: "Growth %", Shopee: 12, TikTok: 45, Tokopedia: 8 },
                  { metric: "Order Vol", Shopee: 85, TikTok: 60, Tokopedia: 35 },
                  { metric: "AOV", Shopee: 72, TikTok: 55, Tokopedia: 68 },
                  { metric: "ROI", Shopee: 78, TikTok: 65, Tokopedia: 58 },
                ]}>
                  <PolarGrid stroke="#e2e8f0" />
                  <PolarAngleAxis dataKey="metric" tick={{ fontSize: 11, fill: COLORS.textSecondary }} />
                  <PolarRadiusAxis tick={false} axisLine={false} />
                  <Radar name="Shopee" dataKey="Shopee" stroke="#2563eb" fill="#2563eb" fillOpacity={0.15} strokeWidth={2} />
                  <Radar name="TikTok" dataKey="TikTok" stroke="#10b981" fill="#10b981" fillOpacity={0.1} strokeWidth={2} />
                  <Radar name="Tokopedia" dataKey="Tokopedia" stroke="#f59e0b" fill="#f59e0b" fillOpacity={0.08} strokeWidth={2} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                </RadarChart>
              </ResponsiveContainer>
            </div>

            {/* 2026 YTD Platform Bar */}
            <div style={{
              background: COLORS.card, borderRadius: 16, padding: 28,
              border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)",
            }}>
              <h3 style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 600, color: COLORS.text }}>
                2026 YTD — Platform Split
              </h3>
              <p style={{ margin: "0 0 16px", fontSize: 12, color: COLORS.textSecondary }}>
                Jan–Feb 2026 GMV per channel
              </p>
              <ResponsiveContainer width="100%" height={300}>
                <BarChart data={PLATFORM_DATA_2026} barGap={4}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" />
                  <XAxis dataKey="month" tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false}
                    tickFormatter={(v) => `${(v / 1e9).toFixed(1)}B`} />
                  <Tooltip formatter={(v) => [fmtFull(v)]} />
                  <Bar dataKey="Shopee" fill="#2563eb" radius={[4, 4, 0, 0]} />
                  <Bar dataKey="TikTok" fill="#10b981" radius={[4, 4, 0, 0]} />
                  <Bar dataKey="Tokopedia" fill="#f59e0b" radius={[4, 4, 0, 0]} />
                  <Bar dataKey="Others" fill="#94a3b8" radius={[4, 4, 0, 0]} />
                  <Legend wrapperStyle={{ fontSize: 12 }} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          </div>
        </>}

        {/* ════════ DAILY TRACKER TAB ════════ */}
        {activeTab === "daily" && <>
          {/* Daily Sales Bar Chart */}
          <div style={{
            background: COLORS.card, borderRadius: 16, padding: 28,
            border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)", marginBottom: 20,
          }}>
            <h3 style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 600, color: COLORS.text }}>
              Daily GMV — February 2026
            </h3>
            <p style={{ margin: "0 0 20px", fontSize: 12, color: COLORS.textSecondary }}>
              Day-by-day performance · Hover for exact values
            </p>
            <ResponsiveContainer width="100%" height={320}>
              <BarChart data={DAILY_FEB_2026}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" />
                <XAxis dataKey="day" tick={{ fontSize: 11, fill: COLORS.textSecondary }} axisLine={false} tickLine={false}
                  tickFormatter={(v) => `${v}`} />
                <YAxis tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false}
                  tickFormatter={(v) => `${(v / 1e9).toFixed(1)}B`} />
                <Tooltip formatter={(v) => [fmtFull(v), "GMV"]}
                  labelFormatter={(v) => `Feb ${v}`} />
                <Bar dataKey="gmv" name="Daily GMV" radius={[4, 4, 0, 0]}>
                  {DAILY_FEB_2026.map((d, i) => (
                    <Cell key={i} fill={
                      d.gmv > 1e9 ? "#059669" :
                      d.gmv > 5e8 ? "#2563eb" :
                      d.gmv > 3e8 ? "#93c5fd" : "#cbd5e1"
                    } />
                  ))}
                </Bar>
              </BarChart>
            </ResponsiveContainer>
            {/* Legend */}
            <div style={{ display: "flex", gap: 20, justifyContent: "center", marginTop: 12 }}>
              {[
                { color: "#059669", label: "> 1B (peak)" },
                { color: "#2563eb", label: "500M–1B" },
                { color: "#93c5fd", label: "300M–500M" },
                { color: "#cbd5e1", label: "< 300M" },
              ].map((l) => (
                <div key={l.label} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: COLORS.textSecondary }}>
                  <div style={{ width: 10, height: 10, borderRadius: 3, background: l.color }} />
                  {l.label}
                </div>
              ))}
            </div>
          </div>

          {/* Day-of-week performance & daily KPIs */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20, marginBottom: 20 }}>
            <div style={{
              background: COLORS.card, borderRadius: 16, padding: 28,
              border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)",
            }}>
              <h3 style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 600, color: COLORS.text }}>
                Average GMV by Day of Week
              </h3>
              <p style={{ margin: "0 0 16px", fontSize: 12, color: COLORS.textSecondary }}>
                Feb 2026 · Which days sell best?
              </p>
              <ResponsiveContainer width="100%" height={240}>
                <BarChart data={(() => {
                  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
                  return days.map((dow) => {
                    const matching = DAILY_FEB_2026.filter((d) => d.dow === dow);
                    const avg = matching.reduce((a, b) => a + b.gmv, 0) / matching.length;
                    return { dow, avgGmv: avg };
                  });
                })()}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" />
                  <XAxis dataKey="dow" tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false} />
                  <YAxis tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false}
                    tickFormatter={(v) => `${(v / 1e6).toFixed(0)}M`} />
                  <Tooltip formatter={(v) => [fmtFull(v), "Avg GMV"]} />
                  <Bar dataKey="avgGmv" fill={COLORS.primary} radius={[6, 6, 0, 0]} name="Avg GMV">
                    {["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((_, i) => (
                      <Cell key={i} fill={i >= 5 ? COLORS.success : COLORS.primary} />
                    ))}
                  </Bar>
                </BarChart>
              </ResponsiveContainer>
              <p style={{ fontSize: 11, color: COLORS.textSecondary, textAlign: "center", marginTop: 8 }}>
                Weekend days highlighted in green
              </p>
            </div>

            {/* Daily stats summary */}
            <div style={{
              background: COLORS.card, borderRadius: 16, padding: 28,
              border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)",
            }}>
              <h3 style={{ margin: "0 0 16px", fontSize: 15, fontWeight: 600, color: COLORS.text }}>
                February 2026 — Daily Stats
              </h3>
              {(() => {
                const sorted = [...DAILY_FEB_2026].sort((a, b) => b.gmv - a.gmv);
                const total = DAILY_FEB_2026.reduce((a, b) => a + b.gmv, 0);
                const avg = total / DAILY_FEB_2026.length;
                const peakDay = sorted[0];
                const lowDay = sorted[sorted.length - 1];
                const above500M = DAILY_FEB_2026.filter((d) => d.gmv > 5e8).length;
                return (
                  <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
                    {[
                      { label: "Total Month GMV", value: fmtFull(total) },
                      { label: "Daily Average", value: fmtFull(avg) },
                      { label: "Peak Day", value: `Feb ${peakDay.day} (${peakDay.dow}) — ${fmtFull(peakDay.gmv)}` },
                      { label: "Lowest Day", value: `Feb ${lowDay.day} (${lowDay.dow}) — ${fmtFull(lowDay.gmv)}` },
                      { label: "Days above 500M", value: `${above500M} of 28 days` },
                      { label: "Peak vs Average", value: `${(peakDay.gmv / avg).toFixed(1)}x above avg` },
                    ].map((s) => (
                      <div key={s.label} style={{
                        display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "10px 14px", borderRadius: 10, background: "#f8fafc",
                      }}>
                        <span style={{ fontSize: 13, color: COLORS.textSecondary }}>{s.label}</span>
                        <span style={{ fontSize: 13, fontWeight: 700, color: COLORS.text }}>{s.value}</span>
                      </div>
                    ))}
                  </div>
                );
              })()}
            </div>
          </div>
        </>}

        {/* ════════ GROWTH FORECAST TAB ════════ */}
        {activeTab === "forecast" && <>
          <div style={{
            background: COLORS.card, borderRadius: 16, padding: 28,
            border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)", marginBottom: 20,
          }}>
            <h3 style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 600, color: COLORS.text }}>
              2026 Growth Projection
            </h3>
            <p style={{ margin: "0 0 20px", fontSize: 12, color: COLORS.textSecondary }}>
              Actual vs Target vs Conservative (+8% YoY) vs Optimistic (+15% YoY) · IDR Billions
            </p>
            <ResponsiveContainer width="100%" height={360}>
              <ComposedChart data={GROWTH_PROJECTION}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" />
                <XAxis dataKey="month" tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false} />
                <YAxis tick={{ fontSize: 12, fill: COLORS.textSecondary }} axisLine={false} tickLine={false}
                  tickFormatter={(v) => `${v.toFixed(0)}B`} />
                <Tooltip formatter={(v) => [`Rp ${v.toFixed(2)}B`]} />
                <Area type="monotone" dataKey="optimistic" stroke="none" fill="#dbeafe" fillOpacity={0.5} name="Optimistic (+15%)" />
                <Area type="monotone" dataKey="conservative" stroke="none" fill="#e0f2fe" fillOpacity={0.5} name="Conservative (+8%)" />
                <Line type="monotone" dataKey="target" stroke={COLORS.warning} strokeWidth={2}
                  strokeDasharray="6 4" dot={false} name="2026 Target" />
                <Line type="monotone" dataKey="conservative" stroke="#06b6d4" strokeWidth={2}
                  strokeDasharray="4 4" dot={false} name="Conservative (+8%)" />
                <Line type="monotone" dataKey="optimistic" stroke="#7c3aed" strokeWidth={2}
                  strokeDasharray="4 4" dot={false} name="Optimistic (+15%)" />
                <Line type="monotone" dataKey="actual" stroke={COLORS.primary} strokeWidth={3}
                  dot={{ r: 5, fill: COLORS.primary, stroke: "#fff", strokeWidth: 2 }}
                  connectNulls name="2026 Actual" />
                <Legend wrapperStyle={{ fontSize: 12 }} />
              </ComposedChart>
            </ResponsiveContainer>
          </div>

          {/* Forecast summary cards */}
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 20, marginBottom: 20 }}>
            {(() => {
              const ytdActual = (SALES_DATA[2026].Jan + SALES_DATA[2026].Feb);
              const fullYearTarget = Object.values(TARGET_2026).reduce((a, b) => a + b, 0);
              const conservative = Object.values(SALES_DATA[2025]).reduce((a, b) => a + (b || 0), 0) * 1.08;
              const optimistic = Object.values(SALES_DATA[2025]).reduce((a, b) => a + (b || 0), 0) * 1.15;
              const runRate = (ytdActual / 2) * 12;
              return [
                {
                  title: "Full Year Target", value: fmt(fullYearTarget),
                  sub: `YTD: ${((ytdActual / fullYearTarget) * 100).toFixed(1)}% achieved`,
                  color: COLORS.warning,
                },
                {
                  title: "Conservative Forecast", value: fmt(conservative),
                  sub: "+8% over 2025 · Based on historical seasonality",
                  color: "#06b6d4",
                },
                {
                  title: "Run Rate Projection", value: fmt(runRate),
                  sub: "If current 2-month pace continues all year",
                  color: COLORS.primary,
                },
              ].map((c) => (
                <div key={c.title} style={{
                  background: COLORS.card, borderRadius: 16, padding: 28,
                  border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)",
                  borderTop: `3px solid ${c.color}`,
                }}>
                  <div style={{ fontSize: 13, fontWeight: 500, color: COLORS.textSecondary, marginBottom: 8 }}>
                    {c.title}
                  </div>
                  <div style={{ fontSize: 26, fontWeight: 700, color: COLORS.text }}>{c.value}</div>
                  <div style={{ fontSize: 12, color: COLORS.textSecondary, marginTop: 6 }}>{c.sub}</div>
                </div>
              ));
            })()}
          </div>

          {/* Month-by-month forecast table */}
          <div style={{
            background: COLORS.card, borderRadius: 16, padding: 28,
            border: "1px solid #e2e8f0", boxShadow: "0 1px 3px rgba(0,0,0,0.04)", marginBottom: 20,
          }}>
            <h3 style={{ margin: "0 0 16px", fontSize: 15, fontWeight: 600, color: COLORS.text }}>
              Monthly Forecast Breakdown
            </h3>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
              <thead>
                <tr style={{ borderBottom: "2px solid #e2e8f0" }}>
                  {["Month", "2025 Actual", "2026 Target", "2026 Actual", "Conservative", "Optimistic", "Gap vs Target"].map((h) => (
                    <th key={h} style={{ textAlign: h === "Month" ? "left" : "right", padding: "10px 12px", color: COLORS.textSecondary, fontWeight: 600 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {GROWTH_PROJECTION.map((d) => {
                  const gap = d.actual != null ? (d.actual - d.target) : null;
                  return (
                    <tr key={d.month} style={{ borderBottom: "1px solid #f1f5f9", background: d.actual ? "transparent" : "#fafafa" }}>
                      <td style={{ padding: "10px 12px", fontWeight: 600 }}>{d.month}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right" }}>{d.conservative ? `Rp ${(d.conservative / 1.08).toFixed(2)}B` : "—"}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right" }}>{`Rp ${d.target.toFixed(2)}B`}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right", fontWeight: 700 }}>{d.actual ? `Rp ${d.actual.toFixed(2)}B` : "—"}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right", color: "#06b6d4" }}>{d.conservative ? `Rp ${d.conservative.toFixed(2)}B` : "—"}</td>
                      <td style={{ padding: "10px 12px", textAlign: "right", color: "#7c3aed" }}>{d.optimistic ? `Rp ${d.optimistic.toFixed(2)}B` : "—"}</td>
                      <td style={{
                        padding: "10px 12px", textAlign: "right", fontWeight: 700,
                        color: gap != null ? (gap >= 0 ? "#059669" : "#dc2626") : COLORS.textSecondary,
                      }}>
                        {gap != null ? `${gap >= 0 ? "+" : ""}Rp ${gap.toFixed(2)}B` : "—"}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </>}

        {/* Footer */}
        <div style={{ textAlign: "center", padding: "24px 0 12px", fontSize: 12, color: COLORS.textSecondary }}>
          SAFF & Co. E-Commerce Analytics · Data through Feb 2026
        </div>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
